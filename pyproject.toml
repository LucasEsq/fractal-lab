[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fractal-lab"
version = "0.1.0"
description = "Interactive fractal education for Jupyter notebooks."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Your Name", email = "you@example.com" }]
keywords = ["fractal", "education", "jupyter", "mandelbrot", "julia-set", "visualization"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Education",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
  "numpy>=1.21",
  "matplotlib>=3.5",
]

[project.optional-dependencies]
interactive = ["ipywidgets>=8.0", "jupyter>=1.0"]
dev = ["pytest>=7.0", "pytest-cov", "ipywidgets>=8.0"]

[project.urls]
Homepage = "https://github.com/YOURNAME/fractal-lab"
Repository = "https://github.com/YOURNAME/fractal-lab"
Issues = "https://github.com/YOURNAME/fractal-lab/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/fractal_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"